  description: Real-time global AIS vessel-tracking stream delivered over a single
    WebSocket at "wss://stream.aisstream.io/v0/stream". The client connects, sends
    a JSON subscription message (APIKey plus BoundingBoxes and optional
    FiltersShipMMSI and FilterMessageTypes), and receives a continuous feed of AIS
    messages - each an envelope with MessageType, a free-form MetaData object, and
    the decoded Message keyed by its type (PositionReport, ShipStaticData, and the
    rest of the ITU-R M.1371 message set).
