name: AISStream
kind: company
description: AISStream.io is a free service that streams global real-time AIS
  (Automatic Identification System) vessel-tracking data over a WebSocket. Clients
  register for a free API key, open a secure WebSocket to
  "wss://stream.aisstream.io/v0/stream", and send a JSON subscription message
  declaring one or more geographic bounding boxes plus optional MMSI and
  message-type filters. The server then pushes a continuous stream of AIS
  messages - PositionReport, ShipStaticData, and the full set of ITU-R M.1371
  message types - each wrapped in an envelope carrying MessageType, MetaData,
  and the decoded Message. There is no REST API; the service is WebSocket-only.
